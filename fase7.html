<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 7 - O Desafio dos Campeões</title>
    <style>
        /* DESIGN PREMIUM GLASSMORPHISM ESPORTIVO (AZUL E OURO) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #0b1329;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game-container {
            background: rgba(28, 37, 65, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(58, 80, 107, 0.4);
            border-radius: 24px;
            width: 100%; max-width: 400px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lives { color: #f43f5e; font-size: 18px; letter-spacing: 2px; }
        .sub-level { background: #ffd700; color: #0b1329; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }

        /* VÍDEO */
        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid #ffd700;
        }

        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }

        /* ÁREA DE RESPOSTA */
        #challenge-area { display: none; animation: fadeIn 0.5s; }
        
        .timer-container {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px; margin-bottom: 20px; overflow: hidden;
        }
        .timer-fill {
            width: 100%; height: 100%;
            background: #ffd700;
            transition: width 1s linear;
        }

        /* GRADE DE FIGURINHAS */
        .stickers-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            justify-content: center;
        }

        .sticker-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .sticker-card:active { transform: scale(0.9); background: rgba(255, 215, 0, 0.2); }
        .sticker-card span { font-size: 35px; display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud">
            <span class="sub-level" id="sub-level-display">SUB-FASE 1/5</span>
            <div class="lives" id="lives-display">❤️❤️❤️</div>
        </div>

        <div class="video-wrapper" id="video-stage">
            <video id="game-video" autoplay muted playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-man-holding-a-basketball-close-up-41617-large.mp4" type="video/mp4">
            </video>
        </div>

        <div id="challenge-area">
            <p style="font-size: 15px; margin-bottom: 5px; color: #ffd700; font-weight: bold;">TESTE DE ATENÇÃO ESPORTIVA 🏅</p>
            <p style="font-size: 13px; margin-bottom: 15px; color: #cbd5e1;">Qual objeto ou esporte apareceu em destaque na cena?</p>
            
            <div class="timer-container">
                <div class="timer-fill" id="timer-bar"></div>
            </div>

            <div class="stickers-list" id="options">
                </div>
        </div>
    </div>

    <script>
        let subLevel = 1;
        let lives = 3;
        let timeLeft = 10;
        let timerInterval;

        // Desafios focados em esportes e objetos olímpicos
        const challenges = [
            { correct: '🏀', options: ['⚽', '🏀', '🏈', '🥎', '🎾'], msg: 'A bola de basquete estava na mão do atleta!' },
            { correct: '🏃', options: ['🚴', '🏊', '🏃', '🚣', '🤸'], msg: 'O corredor de atletismo apareceu!' },
            { correct: '👟', options: ['🥾', '👠', '👟', '🩴', '🥿'], msg: 'O tênis de corrida tocou o chão!' },
            { correct: '⏱️', options: ['📱', '⌚', '⏱️', '⏰', '🧭'], msg: 'O cronômetro marcou o recorde!' },
            { correct: '🥇', options: ['🥈', '🥉', '🥇', '🏆', '🎗️'], msg: 'A medalha de ouro foi conquistada!' }
        ];

        function startSubLevel() {
            const video = document.getElementById('game-video');
            const challengeArea = document.getElementById('challenge-area');
            const videoStage = document.getElementById('video-stage');
            
            challengeArea.style.display = 'none';
            videoStage.style.display = 'block';
            
            video.currentTime = 0;
            video.play();

            // O clipe roda por 5 segundos antes do teste humano aparecer
            setTimeout(() => {
                videoStage.style.display = 'none';
                challengeArea.style.display = 'block';
                renderOptions();
                startTimer();
            }, 5000);
        }

        function renderOptions() {
            const container = document.getElementById('options');
            container.innerHTML = '';
            const current = challenges[subLevel - 1];

            current.options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'sticker-card';
                card.innerHTML = `<span>${opt}</span>`;
                card.onclick = () => checkAnswer(opt === current.correct, current.msg);
                container.appendChild(card);
            });
        }

        function startTimer() {
            timeLeft = 10;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';

            timerInterval = setInterval(() => {
                timeLeft--;
                bar.style.width = (timeLeft * 10) + '%';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleError("⏰ O tempo acabou! O atleta cruzou a linha de chegada sem você.");
                }
            }, 1000);
        }

        function checkAnswer(isCorrect, successMsg) {
            clearInterval(timerInterval);
            if (isCorrect) {
                if (subLevel < 5) {
                    alert(`✨ Ótima visão! ${successMsg}`);
                    subLevel++;
                    document.getElementById('sub-level-display').innerText = `SUB-FASE ${subLevel}/5`;
                    startSubLevel();
                } else {
                    alert("🏆 VITÓRIA OLÍMPICA! Você coletou a Figurinha do Atleta de Ouro! 🏀🏅");
                    // window.location.href = "fase8.html";
                }
            } else {
                handleError("❌ Visão enganada! Esse esporte não passou na tela. Perdeu 1 vida.");
            }
        }

        function handleError(msg) {
            lives--;
            updateLives();
            if (lives <= 0) {
                alert("💀 GAME OVER! Você foi desclassificado da corrida. Reiniciando a fase.");
                location.reload();
            } else {
                alert(msg);
                startSubLevel();
            }
        }

        function updateLives() {
            let h = "";
            for(let i=0; i<3; i++) h += (i < lives) ? "❤️" : "🖤";
            document.getElementById('lives-display').innerText = h;
        }

        window.onload = startSubLevel;
    </script>
</body>
</html>
