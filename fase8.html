<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 8 - O Teste do Chef Humano</title>
    <style>
        /* DESIGN PREMIUM COM GRADIENTE QUENTE E GLASSMORPHISM */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #1c100b;
            color: #fff7ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game-container {
            background: rgba(43, 27, 21, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 24px;
            width: 100%; max-width: 400px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lives { color: #f43f5e; font-size: 18px; letter-spacing: 2px; }
        .sub-level { background: #f97316; color: #1c100b; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }

        /* VÍDEO */
        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid #f97316;
        }

        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }

        /* ÁREA DE DESAFIO */
        #challenge-area { display: none; animation: fadeIn 0.5s; }
        
        .timer-container {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px; margin-bottom: 20px; overflow: hidden;
        }
        .timer-fill {
            width: 100%; height: 100%;
            background: #f97316;
            transition: width 1s linear;
        }

        /* OPÇÕES */
        .stickers-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            justify-content: center;
        }

        .sticker-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .sticker-card:active { transform: scale(0.9); background: rgba(249, 115, 22, 0.2); }
        .sticker-card span { font-size: 35px; display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud">
            <span class="sub-level" id="sub-level-display">SUB-FASE 1/5</span>
            <div class="lives" id="lives-display">❤️❤️❤️</div>
        </div>

        <div class="video-wrapper" id="video-stage">
            <video id="game-video" autoplay muted playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-fresh-ingredients-for-cooking-lying-on-a-table-40156-large.mp4" type="video/mp4">
            </video>
        </div>

        <div id="challenge-area">
            <p style="font-size: 15px; margin-bottom: 5px; color: #f97316; font-weight: bold;">TESTE HUMANO GASTRONÔMICO 🍅</p>
            <p style="font-size: 13px; margin-bottom: 15px; color: #ffedd5;">Qual ingrediente ou utensílio apareceu na preparação?</p>
            
            <div class="timer-container">
                <div class="timer-fill" id="timer-bar"></div>
            </div>

            <div class="stickers-list" id="options">
                </div>
        </div>
    </div>

    <script>
        let subLevel = 1;
        let lives = 3;
        let timeLeft = 10;
        let timerInterval;

        const challenges = [
            { correct: '🍅', options: ['🍇', '🍅', '🍉', '🍍', '🍌'], msg: 'O tomate fresco estava na mesa!' },
            { correct: '🔪', options: ['🔨', '🪓', '🔪', '🔧', '🧲'], msg: 'A faca do chef cortou os alimentos!' },
            { correct: '🥬', options: ['🌽', '🥔', '🥬', '🥕', '🧅'], msg: 'As folhas verdes foram selecionadas!' },
            { correct: '🍳', options: ['🥣', '🫖', '🍳', '🍽️', '🥤'], msg: 'A frigideira estava pronta para o fogo!' },
            { correct: '🧂', options: ['🍯', '🧂', '🧈', '🥛', '🍷'], msg: 'O tempero deu o toque final!' }
        ];

        function startSubLevel() {
            const video = document.getElementById('game-video');
            const challengeArea = document.getElementById('challenge-area');
            const videoStage = document.getElementById('video-stage');
            
            challengeArea.style.display = 'none';
            videoStage.style.display = 'block';
            
            video.currentTime = 0;
            video.play();

            // Roda o clipe por 5 segundos
            setTimeout(() => {
                videoStage.style.display = 'none';
                challengeArea.style.display = 'block';
                renderOptions();
                startTimer();
            }, 5000);
        }

        function renderOptions() {
            const container = document.getElementById('options');
            container.innerHTML = '';
            const current = challenges[subLevel - 1];

            current.options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'sticker-card';
                card.innerHTML = `<span>${opt}</span>`;
                card.onclick = () => checkAnswer(opt === current.correct, current.msg);
                container.appendChild(card);
            });
        }

        function startTimer() {
            timeLeft = 10;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';

            timerInterval = setInterval(() => {
                timeLeft--;
                bar.style.width = (timeLeft * 10) + '%';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleError("⏰ O prato queimou! Você demorou demais.");
                }
            }, 1000);
        }

        function checkAnswer(isCorrect, successMsg) {
            clearInterval(timerInterval);
            if (isCorrect) {
                if (subLevel < 5) {
                    alert(`✨ Chef aprovado! ${successMsg}`);
                    subLevel++;
                    document.getElementById('sub-level-display').innerText = `SUB-FASE ${subLevel}/5`;
                    startSubLevel();
                } else {
                    alert("🏆 RECEITA COMPLETA! Você coletou a Figurinha do Master Chef! 🍅🎒");
                    // window.location.href = "fase9.html";
                }
            } else {
                handleError("❌ Paladar errado! Esse ingrediente não estava na receita. Perdeu 1 vida.");
            }
        }

        function handleError(msg) {
            lives--;
            updateLives();
            if (lives <= 0) {
                alert("💀 GAME OVER! Cozinha interditada. Reiniciando a fase.");
                location.reload();
            } else {
                alert(msg);
                startSubLevel();
            }
        }

        function updateLives() {
            let h = "";
            for(let i=0; i<3; i++) h += (i < lives) ? "❤️" : "🖤";
            document.getElementById('lives-display').innerText = h;
        }

        window.onload = startSubLevel;
    </script>
</body>
</html>
