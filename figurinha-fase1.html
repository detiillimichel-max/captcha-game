<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Figurinhas - Fase 1</title>
    <style>
        /* DESIGN PREMIUM GLASSMORPHISM ESCURO (Para destacar o vídeo e as figurinhas) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%; max-width: 400px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* HUD: Vidas e Fase */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 16px;
        }

        .lives { font-size: 20px; letter-spacing: 2px; }
        .level-badge { background: #e11d48; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }

        /* VÍDEO FAKE PARA O TESTE (Usaremos um GIF/Vídeo real depois) */
        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .video-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        
        .video-overlay {
            position: absolute; top: 10px; right: 10px;
            background: rgba(225, 29, 72, 0.9); padding: 5px 10px;
            border-radius: 8px; font-size: 12px; font-weight: bold;
        }

        /* ÁREA DA PERGUNTA (Escondida no início) */
        #question-area { display: none; }

        .question-title { font-size: 18px; margin-bottom: 15px; font-weight: 600; }

        .timer-bar-bg {
            width: 100%; height: 8px; background: rgba(255,255,255,0.1);
            border-radius: 4px; margin-bottom: 20px; overflow: hidden;
        }
        
        .timer-bar-fill {
            height: 100%; background: #10b981; width: 100%;
            transition: width 1s linear, background-color 0.3s;
        }

        /* FIGURINHAS */
        .stickers-grid {
            display: flex; justify-content: center; gap: 15px;
        }

        .sticker {
            width: 80px; height: 100px;
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 3px solid transparent;
            transition: transform 0.2s;
        }

        .sticker:active { transform: scale(0.9); }
        .sticker.wrong { animation: shake 0.4s; border-color: #e11d48; filter: grayscale(1); }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud">
            <span class="level-badge">FASE 1</span>
            <div class="lives" id="lives-display">❤️❤️❤️</div>
        </div>

        <div class="video-box" id="video-container">
            <div class="video-overlay" id="video-timer">Assistindo: 5s</div>
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&auto=format&fit=crop" alt="Vídeo Gato">
        </div>

        <div id="question-area">
            <h3 class="question-title">Qual figurinha NÃO estava no vídeo?</h3>
            
            <div class="timer-bar-bg">
                <div class="timer-bar-fill" id="action-timer-bar"></div>
            </div>

            <div class="stickers-grid">
                <div class="sticker" onclick="checkAnswer(false, this)">🐱</div>
                <div class="sticker" onclick="checkAnswer(true, this)">🐶</div> <div class="sticker" onclick="checkAnswer(false, this)">🧶</div>
            </div>
        </div>
    </div>

    <script>
        let lives = 3;
        let actionTimeLeft = 15;
        let actionInterval;

        // Inicia o jogo simulando o tempo do vídeo (5 segundos para teste)
        function startVideoPhase() {
            let videoTime = 5;
            const videoTimerDisplay = document.getElementById('video-timer');

            const videoInterval = setInterval(() => {
                videoTime--;
                videoTimerDisplay.innerText = `Assistindo: ${videoTime}s`;

                if (videoTime <= 0) {
                    clearInterval(videoInterval);
                    document.getElementById('video-container').style.display = 'none'; // Some o vídeo
                    document.getElementById('question-area').style.display = 'block'; // Aparece a pergunta
                    startActionTimer();
                }
            }, 1000);
        }

        // Cronômetro da resposta (Barra que diminui)
        function startActionTimer() {
            const bar = document.getElementById('action-timer-bar');
            
            actionInterval = setInterval(() => {
                actionTimeLeft--;
                let percentage = (actionTimeLeft / 15) * 100;
                bar.style.width = percentage + '%';

                if (actionTimeLeft <= 3) {
                    bar.style.background = '#e11d48'; // Fica vermelho no final
                }

                if (actionTimeLeft <= 0) {
                    clearInterval(actionInterval);
                    loseLife("⏰ Tempo esgotado! IA venceria mais rápido.");
                }
            }, 1000);
        }

        // Verifica a resposta clicada
        function checkAnswer(isCorrect, element) {
            clearInterval(actionInterval); // Para o tempo

            if (isCorrect) {
                alert("✨ Acertou! Figurinha Gato Laranja conquistada! Indo para Fase 2...");
                // Aqui depois vamos colocar: window.location.href = "figurinha-fase2.html";
            } else {
                element.classList.add('wrong');
                setTimeout(() => {
                    loseLife("❌ Figurinha errada! Era o Cachorro.");
                }, 500);
            }
        }

        // Sistema de perda de vida e Game Over
        function loseLife(message) {
            lives--;
            updateLivesDisplay();

            if (lives <= 0) {
                alert(message + "\n\n💀 GAME OVER! Você perdeu todas as vidas. Retornando ao Início...");
                location.reload(); // Reseta a página
            } else {
                alert(message + `\n\nVocê ainda tem ${lives} vida(s). Tente novamente!`);
                resetPhase(); // Reseta só a pergunta
            }
        }

        function updateLivesDisplay() {
            let hearts = "";
            for(let i=0; i<3; i++) {
                hearts += (i < lives) ? "❤️" : "🖤";
            }
            document.getElementById('lives-display').innerText = hearts;
        }

        function resetPhase() {
            // Volta para a fase do vídeo
            actionTimeLeft = 15;
            document.getElementById('action-timer-bar').style.width = '100%';
            document.getElementById('action-timer-bar').style.background = '#10b981';
            
            document.querySelectorAll('.sticker').forEach(el => el.classList.remove('wrong'));
            
            document.getElementById('question-area').style.display = 'none';
            document.getElementById('video-container').style.display = 'flex';
            
            startVideoPhase();
        }

        // Inicia assim que a página carrega
        window.onload = startVideoPhase;
    </script>
</body>
</html>
