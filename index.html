<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIO - Human Verification Game</title>
    <style>
        /* DESIGN PREMIUM GLASSMORPHISM */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #1a1c29, #0d0e15);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* CABEÇALHO ESTILO CAPTCHA */
        .captcha-header {
            background: #0070f3;
            padding: 15px;
            border-radius: 16px;
            text-align: left;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 112, 243, 0.3);
        }

        .captcha-header span {
            font-size: 14px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .captcha-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* CRONÔMETRO E STATUS */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.07);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .level-box {
            color: #0070f3;
            font-weight: bold;
            font-size: 14px;
        }

        /* GRADE DE IMAGENS MATRIZ */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .image-tile {
            position: relative;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .image-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ESTADO SELECIONADO (CHECK) */
        .image-tile.selected {
            border-color: #0070f3;
            transform: scale(0.96);
        }

        .image-tile.selected::after {
            content: '✓';
            position: absolute;
            top: 5px;
            left: 5px;
            background: #0070f3;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* BOTÃO VERIFICAR */
        .btn-verify {
            background: #0070f3;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(0, 112, 243, 0.2);
        }

        .btn-verify:active {
            background: #0056b3;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="status-bar">
            <span class="level-box" id="level-display">NÍVEL 1</span>
            <span class="timer-box" id="timer-display">Tempo: 15s</span>
        </div>

        <div class="captcha-header">
            <span id="instruction-sub">Selecione todos os quadrados com</span>
            <h2 id="instruction-main">Carros</h2>
        </div>

        <div class="image-grid" id="image-grid">
            </div>

        <button class="btn-verify" onclick="checkVerification()">VERIFICAR HUMANO</button>
    </div>

    <script>
        // Banco de dados de imagens estáticas (Unsplash livre de direitos) para rodar leve no celular
        const imgBank = {
            carros: [
                "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=150&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=150&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=150&auto=format&fit=crop"
            ],
            animais: [
                "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=150&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1537151625747-768eb6422652?w=150&auto=format&fit=crop"
            ]
        };

        let currentLevel = 1;
        let timeLeft = 15;
        let timerInterval;
        let selectedTiles = [];

        // Inicializa o jogo
        function initGame() {
            clearInterval(timerInterval);
            timeLeft = Math.max(15 - (currentLevel * 2), 6); // Diminui o tempo por nível (mínimo 6s)
            document.getElementById("timer-display").innerText = `Tempo: ${timeLeft}s`;
            document.getElementById("level-display").innerText = `NÍVEL ${currentLevel}`;
            selectedTiles = [];
            
            startTimer();
            generateGrid();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-display").innerText = `Tempo: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("O tempo acabou! Você é um robô? 🤖");
                    currentLevel = 1; // Reseta
                    initGame();
                }
            }, 1000);
        }

        function generateGrid() {
            const grid = document.getElementById("image-grid");
            grid.innerHTML = ""; // Limpa a grade

            // Lógica simples de montagem de nível (Mistura carros e animais)
            let items = [
                { type: 'carro', url: imgBank.carros[0] },
                { type: 'carro', url: imgBank.carros[1] },
                { type: 'animal', url: imgBank.animais[0] },
                { type: 'animal', url: imgBank.animais[1] },
                { type: 'carro', url: imgBank.carros[2] },
                { type: 'animal', url: imgBank.animais[2] },
                { type: 'animal', url: imgBank.animais[0] },
                { type: 'carro', url: imgBank.carros[1] },
                { type: 'animal', url: imgBank.animais[1] }
            ];

            // Sorteia a ordem dos blocos
            items.sort(() => Math.random() - 0.5);

            items.forEach((item, index) => {
                const tile = document.createElement("div");
                tile.classList.add("image-tile");
                tile.dataset.type = item.type;
                tile.dataset.index = index;

                const img = document.createElement("img");
                img.src = item.url;
                
                tile.appendChild(img);
                tile.addEventListener("click", () => toggleSelect(tile, index));
                grid.appendChild(tile);
            });
        }

        function toggleSelect(tile, index) {
            tile.classList.toggle("selected");
            if (tile.classList.contains("selected")) {
                selectedTiles.push(tile);
            } else {
                selectedTiles = selectedTiles.filter(t => t.dataset.index != index);
            }
        }

        function checkVerification() {
            // Verifica se o usuário acertou todos os carros e nenhum animal
            const allTiles = document.querySelectorAll(".image-tile");
            let correct = true;

            allTiles.forEach(tile => {
                const isCarro = tile.dataset.type === 'carro';
                const isSelected = tile.classList.contains("selected");

                if ((isCarro && !isSelected) || (!isCarro && isSelected)) {
                    correct = false; // Errou a seleção
                }
            });

            if (correct) {
                clearInterval(timerInterval);
                alert("Verificação bem-sucedida! Próximo nível... 🚀");
                currentLevel++;
                initGame();
            } else {
                clearInterval(timerInterval);
                alert("Seleção incorreta! Tente novamente.");
                currentLevel = 1; // Reseta ao erro
                initGame();
            }
        }

        // Dá o play automático ao carregar
        window.onload = initGame;
    </script>
</body>
</html>
