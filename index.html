<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Verification Game</title>
    <style>
        /* DESIGN PREMIUM GLASSMORPHISM - MODO CLARO BRANCO */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* TELA DE INTRODUÇÃO EM VÍDEO OVERLAY */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #video-overlay video {
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .btn-skip {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            color: #334155;
            font-weight: 600;
            cursor: pointer;
        }

        /* CONTAINER DO JOGO */
        .game-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(148, 163, 184, 0.15);
            text-align: center;
            display: none; /* Fica escondido até o vídeo acabar */
        }

        .captcha-header {
            background: #0070f3;
            padding: 15px;
            border-radius: 16px;
            text-align: left;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .captcha-header h2 {
            font-size: 22px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .timer-box {
            background: rgba(0, 0, 0, 0.04);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .timer-box.danger {
            color: #ef4444;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .image-tile {
            position: relative;
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .image-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-tile.selected {
            border-color: #0070f3;
        }

        .btn-verify {
            background: #0070f3;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="video-overlay">
        <video id="intro-video" autoplay playsinline>
            <source src="intro.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
        <button class="btn-skip" onclick="startGameDisplay()">Pular Introdução ➔</button>
    </div>

    <div class="game-container" id="main-game">
        <div class="status-bar">
            <span style="color:#0070f3; font-weight:bold;" id="level-display">NÍVEL 1</span>
            <span class="timer-box" id="timer-display">Tempo: 15s</span>
        </div>

        <div class="captcha-header">
            <span style="font-size:12px; opacity:0.9;">Selecione todos os quadrados com</span>
            <h2 id="instruction-main">Carros</h2>
        </div>

        <div class="image-grid" id="image-grid"></div>

        <button class="btn-verify" onclick="checkVerification()">VERIFICAR HUMANO</button>
    </div>

    <script>
        // LÓGICA DE TRANSIÇÃO DO VÍDEO PARA O JOGO
        const introVideo = document.getElementById('intro-video');
        
        // Quando o vídeo terminar de rodar sozinho, inicia o jogo automaticamente
        introVideo.onended = function() {
            startGameDisplay();
        };

        function startGameDisplay() {
            document.getElementById('video-overlay').style.display = 'none'; // Esconde o vídeo
            document.getElementById('main-game').style.display = 'block'; // Mostra o jogo
            initGame(); // Dispara o cronômetro e a grade do jogo
        }

        // BANCO DE IMAGENS ESTÁVEIS
        const imgBank = {
            carros: [
                "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=200",
                "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=200",
                "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=200"
            ],
            gatos: [
                "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200",
                "https://images.unsplash.com/photo-1561948955-570b270e7c36?w=200",
                "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=200"
            ],
            pontes: [
                "https://images.unsplash.com/photo-1513407030348-c9d41992f3e1?w=200",
                "https://images.unsplash.com/photo-1544913716-df2159f8fc3c?w=200",
                "https://images.unsplash.com/photo-1449034446853-66c86144b0ad?w=200"
            ]
        };

        let currentLevel = 1;
        let timeLeft = 15;
        let timerInterval;
        let selectedTiles = [];
        let currentTarget = "";

        function initGame() {
            clearInterval(timerInterval);
            timeLeft = Math.max(15 - Math.floor(currentLevel * 1.5), 5);
            document.getElementById("timer-display").innerText = `Tempo: ${timeLeft}s`;
            document.getElementById("timer-display").classList.remove("danger");
            document.getElementById("level-display").innerText = `NÍVEL ${currentLevel}`;
            selectedTiles = [];
            
            const categories = Object.keys(imgBank);
            currentTarget = categories[Math.floor(Math.random() * categories.length)];
            document.getElementById("instruction-main").innerText = currentTarget;

            startTimer();
            generateGrid();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const timerDisplay = document.getElementById("timer-display");
                timerDisplay.innerText = `Tempo: ${timeLeft}s`;
                if(timeLeft <= 3) timerDisplay.classList.add("danger");

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("O tempo acabou! ⏱️ Reseta para o nível 1.");
                    currentLevel = 1;
                    initGame();
                }
            }, 1000);
        }

        function generateGrid() {
            const grid = document.getElementById("image-grid");
            grid.innerHTML = "";
            let items = [];
            const categories = Object.keys(imgBank);
            
            for(let i=0; i<3; i++) {
                items.push({ type: currentTarget, url: imgBank[currentTarget][i] });
            }

            while(items.length < 9) {
                let randomCat = categories[Math.floor(Math.random() * categories.length)];
                if(randomCat !== currentTarget) {
                    let randomImgIndex = Math.floor(Math.random() * imgBank[randomCat].length);
                    items.push({ type: randomCat, url: imgBank[randomCat][randomImgIndex] });
                }
            }

            items.sort(() => Math.random() - 0.5);

            items.forEach((item, index) => {
                const tile = document.createElement("div");
                tile.classList.add("image-tile");
                tile.dataset.type = item.type;
                tile.dataset.index = index;

                const img = document.createElement("img");
                img.src = item.url;
                
                tile.appendChild(img);
                tile.addEventListener("click", () => {
                    tile.classList.toggle("selected");
                    if (tile.classList.contains("selected")) {
                        selectedTiles.push(tile);
                    } else {
                        selectedTiles = selectedTiles.filter(t => t.dataset.index != index);
                    }
                });
                grid.appendChild(tile);
            });
        }

        function checkVerification() {
            const allTiles = document.querySelectorAll(".image-tile");
            let correct = true;
            let selectedTargetCount = 0;

            allTiles.forEach(tile => {
                const isTarget = tile.dataset.type === currentTarget;
                const isSelected = tile.classList.contains("selected");
                if (isTarget && isSelected) selectedTargetCount++;
                if ((isTarget && !isSelected) || (!isTarget && isSelected)) correct = false;
            });

            if (correct && selectedTargetCount > 0) {
                clearInterval(timerInterval);
                
                if (currentLevel === 3) {
                    alert(`Incrível! Você passou da Fase 1. Carregando a Fase 2... 🚀`);
                    window.location.href = "fase2.html"; 
                } else {
                    alert(`Boa! Indo para o Nível ${currentLevel + 1}... 🚀`);
                    currentLevel++;
                    initGame();
                }
            } else {
                clearInterval(timerInterval);
                alert("Seleção incorreta! Reseta para o nível 1.");
                currentLevel = 1;
                initGame();
            }
        }
    </script>
</body>
</html>
