  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {

  if (document.readyState === 'loading') {

  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true

  window.addEventListener('unhandledrejection', function(event) {

    errorSent = true;

      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAPTCHA 10 Fases</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:12px}
#app{width:min(520px,100%);background:#1e293b;border-radius:18px;box-shadow:0 10px 40px #0007;padding:18px}
h1{margin:0 0 8px;font-size:28px}
p{margin:6px 0;color:#94a3b8}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px}
button:active{transform:scale(.97)}
#hud{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px;font-size:14px}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:#0f172a;border-radius:12px;padding:18px;text-align:center;font-size:28px;user-select:none;cursor:pointer;border:2px solid transparent}
.tile:active{transform:scale(.95)}
.active{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f633}
.hidden{opacity:0}
.center{text-align:center}
.big{font-size:48px;line-height:1}
.badge{background:#0f172a;padding:6px 10px;border-radius:999px}
#game{min-height:240px}
#react{height:180px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:24px;font-weight:800}
.red{background:#7f1d1d}
.green{background:#166534}
.card{background:#0f172a;border-radius:10px;height:70px;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
.flipped{background:#334155}
.ok{color:#22c55e}
.bad{color:#ef4444}
</style>
</head>
<body>
<div id="app">
  <div id="start" class="center">
    <h1>CAPTCHA 10 Fases</h1>
    <p>Prove que você é humano. 10 mini-desafios com emojis.</p>
    <p>Vidas: ❤️❤️❤️ | Recorde: <b id="best">0</b></p>
    <button id="btnStart">Iniciar</button>
  </div>

  <div id="play" style="display:none">
    <div id="hud">
      <span class="badge">Fase <span id="fase">1</span>/10</span>
      <span class="badge" id="vidas">❤️❤️❤️</span>
      <span class="badge">⭐ <span id="pts">0</span></span>
    </div>
    <div id="game"></div>
  </div>

  <div id="over" style="display:none" class="center">
    <h1 id="overTitle">Fim de Jogo</h1>
    <p>Pontuação: <b id="finalPts">0</b></p>
    <p>Recorde: <b id="finalBest">0</b></p>
    <button id="btnRestart">Jogar Novamente</button>
  </div>
</div>

<script>
const $=s=>document.getElementById(s);
const game=$('game');
let state={fase:0,lives:3,score:0,best:+localStorage.getItem('captcha10best')||0,lock:false,timers:[]};
$('best').textContent=state.best;
const clearT=()=>{state.timers.forEach(clearTimeout);state.timers=[];};
const setLives=()=>{$('vidas').textContent='❤️'.repeat(state.lives)+'🖤'.repeat(3-state.lives)};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.sort(()=>Math.random()-.5);

function show(sel){
 $('start').style.display=sel==='start'?'block':'none';
 $('play').style.display=sel==='play'?'block':'none';
 $('over').style.display=sel==='over'?'block':'none';
}
function lose(msg){
 if(state.lock)return;
 state.lives--;setLives();
 if(state.lives<=0) return gameOver(false);
 game.innerHTML=`<p class="center bad big">✖</p><p class="center">${msg||'Errou!'}</p>`;
 state.lock=true;
 state.timers.push(setTimeout(()=>{state.lock=false;startPhase(state.fase);},1000));
}
function win(){
 state.score+=100;
 $('pts').textContent=state.score;
 if(state.fase===9) return gameOver(true);
 state.fase++;
 $('fase').textContent=state.fase+1;
 game.innerHTML=`<p class="center ok big">✔</p>`;
 state.timers.push(setTimeout(()=>startPhase(state.fase),700));
}
function gameOver(ok){
 clearT();
 show('over');
 $('overTitle').textContent= ok?'Você é humano!':'Fim de Jogo';
 $('finalPts').textContent=state.score;
 if(state.score>state.best){state.best=state.score;localStorage.setItem('captcha10best',state.best);}
 $('finalBest').textContent=state.best;
}

function startGame(){
 state={...state,fase:0,lives:3,score:0,lock:false,timers:[]};
 setLives();$('pts').textContent=0;$('fase').textContent=1;
 show('play');startPhase(0);
}
function startPhase(i){clearT();game.innerHTML='';[
p1,p2,p3,p4,p5,p6,p7,p8,p9,p10
][i]();}

/* FASE 1 - Simon 3 passos */
function p1(){
 const em=['🟥','🟩','🟦','🟨']; const seq=Array.from({length:3},()=>rnd(em));
 game.innerHTML=`<p class="center">Memorize a sequência</p><div class="grid g4" id="g"></div>`;
 const g=$('g'); em.forEach(e=>g.innerHTML+=`<div class="tile">${e}</div>`);
 let idx=0;
 const flash=()=>{if(idx>=seq.length)return ask(); g.children[em.indexOf(seq[idx])].classList.add('active');
 state.timers.push(setTimeout(()=>{g.children[em.indexOf(seq[idx])].classList.remove('active');idx++;state.timers.push(setTimeout(flash,250));},600));};
 flash();
 function ask(){
  game.innerHTML=`<p class="center">Repita a sequência</p><div class="grid g4" id="g2"></div>`;
  const g2=$('g2'); em.forEach(e=>{const d=document.createElement('div');d.className='tile';d.textContent=e;d.onclick=()=>{if(e!==seq.shift())lose('Sequência errada');else if(seq.length===0)win();};g2.appendChild(d);});
 }
}

/* FASE 2 - Intruso */
function p2(){
 const base=['🍎','🍊','🍌','🍇','🍓']; const b=rnd(base); let i=rnd(base.filter(x=>x!==b));
 const cells=Array(9).fill(b); cells[Math.floor(Math.random()*9)]=i;
 game.innerHTML=`<p class="center">Toque no intruso</p><div class="grid g3" id="g"></div>`;
 const g=$('g');cells.forEach(c=>{const d=document.createElement('div');d.className='tile';d.textContent=c;d.onclick=()=>c===i?win():lose('Não é o intruso');g.appendChild(d);});
}

/* FASE 3 - Toque no sticker */
function p3(){
 const opts=['🐱','🐶','🐸','🐼','🐵','🦊']; const target=rnd(opts);
 game.innerHTML=`<p class="center">Toque em ${target}</p><div class="grid g3" id="g"></div>`;
 shuffle([...opts]).forEach(e=>{const d=document.createElement('div');d.className='tile';d.textContent=e;d.onclick=()=>e===target?win():lose();$('g').appendChild(d);});
}

/* FASE 4 - Reação */
function p4(){
 game.innerHTML=`<div id="react" class="red">Aguarde...</div><p class="center">Clique quando ficar verde</p>`;
 const r=$('react'); let ready=false; let early=false;
 const delay=2000+Math.random()*2000;
 state.timers.push(setTimeout(()=>{r.className='green';r.textContent='CLIQUE!';ready=true;state.timers.push(setTimeout(()=>{if(ready)lose('Muito lento');},1000));},delay));
 r.onclick=()=>{if(!ready){early=true;lose('Cedo demais!');}else{ready=false;win();}};
}

/* FASE 5 - Contagem */
function p5(){
 const e=rnd(['🍎','⭐','💧']); const cnt=3+Math.floor(Math.random()*5);
 const total=12; const arr=[]; for(let i=0;i<cnt;i++)arr.push(e); while(arr.length<total)arr.push(rnd(['🍎','⭐','💧','🍋'].filter(x=>x!==e)));
 shuffle(arr);
 game.innerHTML=`<p class="center">Quantos ${e} ?</p><div class="grid g4" id="g"></div><div class="grid g4" id="opt"></div>`;
 $('g').innerHTML=arr.map(x=>`<div class="tile">${x}</div>`).join('');
 [cnt-1,cnt,cnt+1,cnt+2].filter(n=>n>0).slice(0,4).sort((a,b)=>a-b).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>n===cnt?win():lose();$('opt').appendChild(b);});
}

/* FASE 6 - Padrão setas */
function p6(){
 const seq=['➡️','➡️','⬇️','⬇️']; game.innerHTML=`<p class="center">Complete: ${seq.join(' ') } ?</p><div class="grid g4" id="g"></div>`;
 ['➡️','⬅️','⬆️','⬇️'].forEach(a=>{const d=document.createElement('div');d.className='tile';d.textContent=a;d.onclick=()=>a==='⬅️'?win():lose();$('g').appendChild(d);});
}

/* FASE 7 - Memória de cor */
function p7(){
 const cols=[{c:'#dc2626',e:'🐶'},{c:'#2563eb',e:'🐱'},{c:'#16a34a',e:'🐸'}]; shuffle(cols);
 game.innerHTML=`<p class="center">Memorize as cores</p><div class="grid g3" id="g"></div>`;
 const g=$('g'); cols.forEach(o=>{const d=document.createElement('div');d.className='tile';d.style.background=o.c;d.textContent=o.e;g.appendChild(d);});
 state.timers.push(setTimeout(()=>{
  const q=rnd(cols);
  game.innerHTML=`<p class="center">Qual a cor do ${q.e} ?</p><div class="grid g3" id="c"></div>`;
  cols.forEach(o=>{const d=document.createElement('div');d.className='tile';d.style.background=o.c;d.onclick=()=>o.c===q.c?win():lose();$('c').appendChild(d);});
 },2000));
}

/* FASE 8 - Puzzle 3x3 */
function p8(){
 let a=[1,2,3,4,5,6,7,8,0]; for(let i=0;i<40;i++){const z=a.indexOf(0);const m=[z-3,z+3,z-1,z+1].filter(p=>p>=0&&p<9&&!(z%3===0&&p===z-1)&&!(z%3===2&&p===z+1));const s=rnd(m);[a[z],a[s]]=[a[s],a[z]];}
 const render=()=>{game.innerHTML=`<p class="center">Deslize para ordenar 1-8</p><div class="grid g3" id="g"></div>`;const g=$('g');a.forEach((v,i)=>{const d=document.createElement('div');d.className='tile';d.textContent=v||'';d.onclick=()=>move(i);g.appendChild(d);});};
 const move=i=>{const z=a.indexOf(0);if([z-3,z+3,z-1,z+1].includes(i)&&!(z%3===0&&i===z-1)&&!(z%3===2&&i===z+1)){[a[z],a[i]]=[a[i],a[z]];render();if(a.slice(0,8).every((v,i)=>v===i+1))win();}};
 render();
}

/* FASE 9 - Pares */
function p9(){
 const em=['🍎','🍎','⭐','⭐','🐱','🐱','🚀','🚀']; shuffle(em);
 let open=[],matched=0;
 game.innerHTML=`<p class="center">Encontre os pares</p><div class="grid g4" id="g"></div>`;
 const g=$('g');em.forEach((e,i)=>{const d=document.createElement('div');d.className='card';d.dataset.e=e;d.dataset.i=i;d.textContent='?';d.onclick=()=>flip(d);g.appendChild(d);});
 function flip(d){
  if(d.classList.contains('flipped')||open.length===2)return;
  d.classList.add('flipped');d.textContent=d.dataset.e;open.push(d);
  if(open.length===2){if(open[0].dataset.e===open[1].dataset.e){matched+=2;open=[];if(matched===8)win();}else{state.timers.push(setTimeout(()=>{open.forEach(x=>{x.classList.remove('flipped');x.textContent='?';});open=[];},600));}}
 }
}

/* FASE 10 - Boss mix */
function p10(){
 const em=['🟥','🟩','🟦','🟨']; const seq=Array.from({length:4},()=>rnd(em));
 game.innerHTML=`<p class="center">Boss: Repita 4 cores</p><div class="grid g4" id="g"></div>`;
 const g=$('g'); let i=0;
 const flash=()=>{if(i>=seq.length)return ask();g.children[em.indexOf(seq[i])].classList.add('active');state.timers.push(setTimeout(()=>{g.children[em.indexOf(seq[i])].classList.remove('active');i++;state.timers.push(setTimeout(flash,180));},400));};
 em.forEach(e=>g.innerHTML+=`<div class="tile">${e}</div>`); flash();
 function ask(){game.innerHTML=`<p class="center">Sua vez</p><div class="grid g4" id="g2"></div>`;const g2=$('g2');let idx=0;em.forEach(e=>{const d=document.createElement('div');d.className='tile';d.textContent=e;d.onclick=()=>{if(e!==seq[idx])lose('Boss falhou');else{idx++;if(idx===seq.length)win();}};g2.appendChild(d);});}
}

$('btnStart').onclick=startGame;
$('btnRestart').onclick=startGame;
show('start');
</script>
<script>(function(){document.addEventListener("click",function(e){var a=e.target.closest("[data-product-id]");if(!a)return;e.preventDefault();var pid=a.getAttribute("data-product-id");if(pid)parent.postMessage({type:"ecto-artifact-link-click",productId:pid},"*")})})();</script>
</body>
